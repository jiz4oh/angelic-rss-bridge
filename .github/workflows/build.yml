name: build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_bridge:
        description: Build RSS bridge image
        type: boolean
        default: true
      build_upstream:
        description: Build Angelic Angel image
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
      upstream: ${{ steps.filter.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bridge:
              - 'bridge.py'
              - 'Dockerfile'
            upstream:
              - 'upstream/Angelic-Angel'
              - 'Dockerfile.angelic-angel'

  bridge:
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/angelic-rss-bridge
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,mode=max,scope=bridge

  upstream:
    needs: changes
    if: needs.changes.outputs.upstream == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_upstream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve upstream version
        id: upstream
        run: echo "sha=$(git -C upstream/Angelic-Angel rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/angelic-angel
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.angelic-angel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=angelic-angel
          cache-to: type=gha,mode=max,scope=angelic-angel
