services:
  bridge:
    image: ghcr.io/jiz4oh/angelic-rss-bridge:latest
    restart: unless-stopped
    environment:
      PORT: ${BRIDGE_PORT}
      FEED_TITLE: ${FEED_TITLE:-Angelic Angel}
      FEED_LINK: ${FEED_LINK}
      MAX_ITEMS: ${MAX_ITEMS:-100}
    volumes:
      - ./data/bridge:/data
    ports:
      - "${BRIDGE_PORT}:${BRIDGE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  angelic-angel:
    image: ghcr.io/jiz4oh/angelic-angel:latest
    restart: unless-stopped
    environment:
      WEBHOOK_ENDPOINT: http://bridge:${BRIDGE_PORT}/webhook
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data/angelic-angel:/config
    command: ["listen"]
